onboarding = false

[ui]
hide_tab_bar_when_single_tab = false
prompt_new_tab_name = false
pane_outer_borders = false
pane_gaps = false
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "command", command = """uptime -p | sed 's/^up //; s/ hours\\?/h/; s/ minutes\\?/m/; s/ days\\?/d/; s/,//g'""", interval_seconds = 60, timeout_seconds = 2 },
  { type = "command", command = """free -h | awk '/Mem/{print $3 "/" $2}'""", interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = """df -h --output=avail,pcent / | awk 'NR==2{print $1 " " $2}'""", interval_seconds = 60, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "gruvbox"
auto_switch = false

[keys]
prefix = "ctrl+space"
split_vertical = "prefix+v"
split_horizontal = "prefix+h"
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"

[advanced]
scrollback_limit_bytes = 100000000
