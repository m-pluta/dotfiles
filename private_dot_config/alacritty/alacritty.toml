[font]
size = 11

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[window]
startup_mode = "Maximized"
decorations = "none"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
